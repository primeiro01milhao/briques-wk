<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Villa Sol — Dashboard Mensal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --orange:#ff5a0a;
  --orange2:#ff7a22;
  --deep:#17120f;
  --ink:#211915;
  --muted:#8c7b70;
  --glass:rgba(255,255,255,.48);
  --line:rgba(255,255,255,.72);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 82% 18%,rgba(255,129,52,.42),transparent 30%),
    radial-gradient(circle at 18% 82%,rgba(255,255,255,.72),transparent 28%),
    linear-gradient(135deg,#fff8f1 0%,#ffe6d1 48%,#ff9b5b 100%);
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:-30%;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.34) 50%,transparent 58%);
  filter:blur(35px);
  animation:solar 12s ease-in-out infinite;
}
@keyframes solar{
  0%,25%{transform:translateX(-35%);opacity:0}
  45%{opacity:.7}
  75%,100%{transform:translateX(35%);opacity:0}
}
.container{
  width:min(1240px,calc(100% - 36px));
  margin:auto;
  padding:28px 0 40px;
  position:relative;
  z-index:1;
}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}
.eyebrow{
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}
h1{
  margin:4px 0 0;
  font-size:30px;
  letter-spacing:-1.2px;
}
.subtitle{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px;
}
.month-control{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px;
  border-radius:16px;
  background:rgba(255,255,255,.42);
  border:1px solid rgba(255,255,255,.8);
  backdrop-filter:blur(20px);
}
.month-control button{
  width:30px;height:30px;
  border:0;border-radius:10px;
  background:rgba(255,255,255,.6);
  cursor:pointer;color:var(--ink);
}
#monthLabel{
  min-width:125px;
  text-align:center;
  font-size:11px;
  font-weight:600;
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:12px;
}
.card{
  position:relative;
  overflow:hidden;
  padding:16px;
  min-height:92px;
  border-radius:20px;
  background:var(--glass);
  border:1px solid var(--line);
  backdrop-filter:blur(25px) saturate(140%);
  box-shadow:0 18px 45px rgba(91,45,20,.09),inset 0 1px rgba(255,255,255,.9);
}
.card small{
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.card b{
  display:block;
  margin-top:8px;
  font-size:24px;
  letter-spacing:-1px;
}
.card.revenue{
  color:white;
  background:linear-gradient(120deg,#17120f,#3b1c0d,#ff5a0a,#ff7a22,#17120f);
  background-size:280% 280%;
  animation:brand 10s ease-in-out infinite;
  box-shadow:0 22px 55px rgba(249,90,10,.23);
}
.card.revenue small{color:rgba(255,255,255,.7)}
.card.revenue:after{
  content:"";
  position:absolute;
  top:-80%;left:-35%;
  width:30%;height:260%;
  transform:rotate(22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  filter:blur(9px);
  animation:reflection 8s ease-in-out infinite;
}
@keyframes brand{
  0%,100%{background-position:0 50%}
  50%{background-position:100% 50%}
}
@keyframes reflection{
  0%,25%{left:-45%;opacity:0}
  40%{opacity:.8}
  65%{left:120%;opacity:.25}
  80%,100%{left:130%;opacity:0}
}
.panel{
  padding:16px;
  border-radius:22px;
  background:rgba(255,255,255,.44);
  border:1px solid rgba(255,255,255,.78);
  backdrop-filter:blur(25px) saturate(140%);
  box-shadow:0 18px 50px rgba(91,45,20,.08),inset 0 1px rgba(255,255,255,.9);
}
.panel-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.panel-title h2{
  margin:0;
  font-size:13px;
}
.panel-title span{
  color:var(--muted);
  font-size:10px;
}
.table-wrap{overflow:auto;border-radius:16px}
table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
}
th{
  padding:8px 9px;
  text-align:center;
  font-size:8px;
  color:#98877c;
  text-transform:uppercase;
  letter-spacing:.07em;
  border-bottom:1px solid rgba(120,90,70,.13);
}
td{
  padding:7px 9px;
  text-align:center;
  font-size:11px;
  border-bottom:1px solid rgba(120,90,70,.08);
}
td:first-child{text-align:left}
input{
  width:100%;
  min-width:70px;
  padding:7px 8px;
  border-radius:10px;
  border:1px solid rgba(120,90,70,.12);
  background:rgba(255,255,255,.55);
  color:var(--ink);
  outline:none;
}
input:focus{
  border-color:rgba(255,90,10,.45);
  box-shadow:0 0 0 3px rgba(255,90,10,.08);
}
.actions{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}
button{
  border:0;
  border-radius:12px;
  padding:9px 13px;
  font-size:10px;
  font-weight:600;
  cursor:pointer;
}
.primary{
  color:#fff;
  background:linear-gradient(135deg,#ff731d,#f34b05);
  box-shadow:0 8px 20px rgba(255,90,10,.18);
}
.secondary{
  color:#6f5e53;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.78);
}
.remove{
  color:#b42318;
  background:rgba(255,255,255,.55);
  padding:7px 9px;
}
.file{
  display:flex;
  align-items:center;
  padding:8px 11px;
  border-radius:12px;
  background:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.75);
  font-size:10px;
}
.file input{display:none}
.kpi{
  color:#a74619;
  font-weight:600;
}
.footer-note{
  margin-top:10px;
  color:#927f73;
  font-size:9px;
}
@media(max-width:1000px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
  .container{width:min(100% - 20px,1240px);padding-top:18px}
  .topbar{align-items:flex-start;flex-direction:column}
  .grid{grid-template-columns:repeat(2,1fr)}
  .card b{font-size:20px}
}
</style>
</head>

<body>
<div class="container">

  <div class="topbar">
    <div>
      <div class="eyebrow">Villa Sol Eventos</div>
      <h1>Dashboard Mensal</h1>
      <div class="subtitle">Controle de faturamento, investimento e margem.</div>
    </div>
    <div class="month-control">
      <button onclick="changeMonth(-1)">‹</button>
      <div id="monthLabel"></div>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="grid">
    <div class="card revenue"><small>Faturamento</small><b id="fat">R$ 0,00</b></div>
    <div class="card"><small>Investimento</small><b id="inv">R$ 0,00</b></div>
    <div class="card"><small>Lucro</small><b id="luc">R$ 0,00</b></div>
    <div class="card"><small>Margem</small><b id="mar">0%</b></div>
    <div class="card"><small>ROI</small><b id="roi">0%</b></div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <h2>Produtos / Operações</h2>
      <span id="count">0 registros</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Paguei</th>
            <th>Vendi</th>
            <th>Qtd</th>
            <th>KM</th>
            <th>Custo KM</th>
            <th>Lucro</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>

    <div class="actions">
      <button class="primary" onclick="add()">+ Adicionar</button>
      <button class="secondary" onclick="exp()">Exportar</button>
      <label class="file">Importar backup <input type="file" accept=".json" onchange="imp(event)"></label>
    </div>
    <div class="footer-note">Os dados ficam salvos automaticamente neste dispositivo.</div>
  </div>

</div>

<script>
const STORAGE_KEY="villa_sol_dashboard_mensal_v2";
let selectedMonth=new Date().getMonth();
let selectedYear=new Date().getFullYear();
let data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");

const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);

function monthName(){
  return new Date(selectedYear,selectedMonth,1)
    .toLocaleDateString("pt-BR",{month:"long",year:"numeric"})
    .replace(/^./,c=>c.toUpperCase());
}
function changeMonth(step){
  selectedMonth+=step;
  if(selectedMonth>11){selectedMonth=0;selectedYear++}
  if(selectedMonth<0){selectedMonth=11;selectedYear--}
  document.getElementById("monthLabel").textContent=monthName();
  render();
}
function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}
function add(p="",pg="",vd="",q="",km=""){
  const tr=document.createElement("tr");
  tr.innerHTML=`
    <td><input value="${escapeHtml(p)}"></td>
    <td><input type="number" min="0" step="0.01" value="${pg}"></td>
    <td><input type="number" min="0" step="0.01" value="${vd}"></td>
    <td><input type="number" min="0" step="1" value="${q}"></td>
    <td><input type="number" min="0" step="1" value="${km}"></td>
    <td class="km">R$ 0,00</td>
    <td class="l">R$ 0,00</td>
    <td><button class="remove" onclick="del(this)">Excluir</button></td>`;
  tr.querySelectorAll("input").forEach(i=>i.addEventListener("input",calc));
  document.getElementById("tb").appendChild(tr);
  calc();
}
function del(b){
  b.closest("tr").remove();
  calc();
}
function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function calc(){
  const rows=[...document.querySelectorAll("#tb tr")];
  data=[];
  let fat=0,inv=0,des=0;

  rows.forEach(r=>{
    const i=r.querySelectorAll("input");
    const p=i[0].value;
    const pg=+i[1].value||0;
    const vd=+i[2].value||0;
    const q=+i[3].value||0;
    const km=+i[4].value||0;

    const custo=Math.ceil(km);
    const receita=vd*q;
    const custoProduto=pg*q;
    const lucro=receita-custoProduto-custo;

    r.querySelector(".km").textContent=money(custo);
    r.querySelector(".l").textContent=money(lucro);
    r.querySelector(".l").className="l "+(lucro>=0?"kpi":"");

    fat+=receita;
    inv+=custoProduto;
    des+=custo;
    data.push({p,pg,vd,q,km});
  });

  const totalInv=inv+des;
  const lucro=fat-totalInv;
  const margem=fat?(lucro/fat)*100:0;
  const roi=totalInv?(lucro/totalInv)*100:0;

  document.getElementById("fat").textContent=money(fat);
  document.getElementById("inv").textContent=money(totalInv);
  document.getElementById("luc").textContent=money(lucro);
  document.getElementById("mar").textContent=margem.toFixed(1)+"%";
  document.getElementById("roi").textContent=roi.toFixed(1)+"%";
  document.getElementById("count").textContent=`${rows.length} ${rows.length===1?"registro":"registros"}`;
  save();
}
function render(){
  const tb=document.getElementById("tb");
  tb.innerHTML="";
  data.forEach(d=>add(d.p,d.pg,d.vd,d.q,d.km));
  document.getElementById("monthLabel").textContent=monthName();
  calc();
}
function exp(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`villa-sol-dashboard-${selectedYear}-${String(selectedMonth+1).padStart(2,"0")}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function imp(e){
  const f=e.target.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=x=>{
    try{
      const imported=JSON.parse(x.target.result);
      if(!Array.isArray(imported))throw new Error();
      data=imported;
      save();
      render();
    }catch{
      alert("Arquivo de backup inválido.");
    }
  };
  reader.readAsText(f);
}
document.getElementById("monthLabel").textContent=monthName();
render();
</script>
</body>
</html>
